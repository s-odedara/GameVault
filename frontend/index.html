<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>GameVault — The Ultimate Game Discovery Platform</title>
    <meta name="description" content="Discover, track, and trade video games on GameVault. Your personal game library, P2P marketplace, and community — all in one place." />
    <meta name="theme-color" content="#0b0f1a" />
    <meta name="author" content="GameVault" />
    <meta property="og:title" content="GameVault — The Ultimate Game Discovery Platform" />
    <meta property="og:description" content="Discover, explore, and track the best video games. Buy & sell physical discs in our P2P marketplace." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GameVault — The Ultimate Game Discovery Platform" />
    <meta name="twitter:description" content="Discover, explore, and track the best video games across all platforms." />

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />

    <!-- Google Fonts: Outfit (premium gaming) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- AOS — Animate On Scroll -->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />

    <!-- Swiper.js — Recommended Games Carousel -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Razorpay Checkout (for online payment option) -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- AOS — Initialize in main.jsx, script loaded here -->
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <!-- Swiper.js -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- vanilla-tilt.js — 3D Card Tilt on Hover -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
